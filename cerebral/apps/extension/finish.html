<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teach the agent</title>
<style>
  :root { --bg: #ffffff; --fg: #1a1a1a; --muted: #6b6b6b; --line: #e3e3e3; --accent: #5b8def; --bad: #b00020; --ok: #1e8e3e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121212; --fg: #ececec; --muted: #9a9a9a; --line: #2c2c2c; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  label { display: block; margin-top: 14px; font-size: 13px; color: var(--muted); }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; margin-top: 4px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: var(--fg); font: inherit; }
  button { padding: 10px 16px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
  button:disabled { opacity: .6; cursor: default; }
  .row { display: flex; gap: 8px; margin-top: 18px; align-items: center; }
  ol { padding-left: 20px; margin: 8px 0 0; }
  li { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .mono { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); word-break: break-all; }
  .pill { display: inline-block; font-size: 11px; padding: 1px 7px; border: 1px solid var(--line); border-radius: 999px; margin-left: 6px; color: var(--muted); }
  .err { color: var(--bad); }
  .ok { color: var(--ok); }
  section { margin-top: 24px; }
</style>
</head>
<body>
<main>
  <div id="app"><p class="muted">Loading…</p></div>
</main>
<script type="module" src="finish.js"></script>
</body>
</html>
