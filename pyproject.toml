[project]
name = "cobrowse-agent-orchestrator"
version = "0.1.0"
description = "Self-Improving Co-Browsing Agent with Meta Muse Spark 1.3, Stagehand v4, MongoDB Atlas Vector Search, and Fetch.ai uAgents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.4",
    "python-dotenv>=1.0.1",
    "websockets>=14.1",
    "httpx>=0.28.1",
    # Deep Agents & Co-Browser Stack
    "langgraph>=1.2.0",
    "langchain>=1.4.7",
    "langchain-core>=0.3.28",
    "deepagents>=0.7.34",
    "stagehand>=4.4.0",
    "langchain-stagehand>=0.0.1",
    "playwright>=1.49.1",
    # Sponsor 1 & 4: Meta Model API (muse-spark-1.3) & Subquadratic (SubQ Snap 1.1) via OpenAI SDK
    "openai>=1.60.0",
    # Sponsor 2: MongoDB Atlas Vector Search
    "pymongo[srv]>=4.10.1",
    # Sponsor 3: Fetch.ai Agentverse & Chat Protocol
    "uagents>=0.18.0",
    "uagents-core>=0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.2",
    "pre-commit>=4.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services/agent-orchestrator/tests"]
